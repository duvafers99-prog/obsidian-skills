<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1410">
<title>Pizzería · idle animada</title>
<style>
  :root{
    --bg:#2a1410; --wood:#7a4a2b; --wood2:#5e3820; --ink:#fff5e9; --gold:#ffcf4d; --green:#5fe08a;
    --card:#3a1f16; --line:#5a3423; --red:#e04a3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(900px 500px at 50% -10%,#3a1c14,#2a1410 60%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;
    padding:max(6px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));touch-action:manipulation;
  }
  .app{width:100%;max-width:480px;display:flex;flex-direction:column;height:100%;gap:8px}
  /* HUD */
  .hud{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
  .money{font-size:32px;font-weight:900;color:var(--gold);letter-spacing:.5px;text-shadow:0 2px 14px rgba(255,207,77,.3)}
  .per{font-size:13px;color:#e7c9a8}
  /* SCENE */
  .scene{position:relative;width:100%;flex:1;min-height:230px;border-radius:20px;overflow:hidden;
    background:
      linear-gradient(180deg,#4a2417 0%,#4a2417 42%,#6b3f24 42%,#7a4a2b 100%);
    border:2px solid #1c0d09;box-shadow:inset 0 2px 0 rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.4)}
  /* wall + sign */
  .sign{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;
    background:var(--red);color:#fff;font-weight:900;font-size:14px;letter-spacing:1px;
    padding:5px 16px;border-radius:10px;box-shadow:0 4px 0 #a8281c, 0 8px 14px rgba(0,0,0,.35);border:2px solid #ffd9a0}
  .sign small{display:block;font-size:9px;font-weight:700;opacity:.9;letter-spacing:.5px}
  .bunting{position:absolute;top:0;left:0;right:0;height:14px;z-index:2;
    background:repeating-linear-gradient(45deg,#e04a3a 0 12px,#ffd23f 12px 24px);opacity:.85}
  /* chef */
  .kitchen{position:absolute;left:4%;bottom:4%;z-index:4;display:flex;flex-direction:column;align-items:center}
  .chefs{display:flex;align-items:flex-end;height:70px;cursor:pointer}
  .chef{font-size:46px;line-height:1;animation:bob 1.6s ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
  .chef:nth-child(2){font-size:34px;animation-delay:.3s;margin-left:-8px}
  .chef:nth-child(3){font-size:30px;animation-delay:.6s;margin-left:-8px}
  .chefs.working .chef{animation-duration:.7s}
  .chefs:active{transform:scale(.94)}
  .cookbadge{margin-top:2px;background:#0006;border:1px solid var(--line);border-radius:8px;font-size:11px;font-weight:800;padding:1px 8px;color:var(--gold)}
  .dough{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:22px;opacity:0;pointer-events:none}
  /* counter / belt */
  .belt{position:absolute;left:20%;right:16%;bottom:16%;height:16px;border-radius:8px;z-index:3;
    background:#2a1a12;border:2px solid #17100b;overflow:hidden}
  .belt::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,#4b3020 0 14px,#3a251a 14px 28px);animation:belt 1s linear infinite}
  .belt-legs{position:absolute;left:20%;right:16%;bottom:8%;height:10%;z-index:2}
  /* customer */
  .customer{position:absolute;right:3%;bottom:5%;z-index:4;font-size:44px;line-height:1;transform-origin:bottom center;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
  .customer.eat{animation:chomp .35s ease}
  /* moving pizza */
  .pz{position:absolute;z-index:5;font-size:26px;pointer-events:none;will-change:transform;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
  .coin{position:absolute;z-index:6;font-weight:900;font-size:15px;color:var(--green);pointer-events:none;text-shadow:0 1px 2px #000}
  .tapme{position:absolute;left:4%;bottom:78px;z-index:5;font-size:11px;color:#ffe;opacity:.9;animation:pulse 1.3s ease-in-out infinite;pointer-events:none}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
  @keyframes belt{to{background-position:-28px 0}}
  @keyframes chomp{0%,100%{transform:scale(1)}40%{transform:scale(1.18,.86)}70%{transform:scale(.95,1.05)}}
  @keyframes pulse{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  /* controls */
  .tapbtn{width:100%;font:inherit;font-weight:900;font-size:18px;color:#fff;border:none;border-radius:16px;padding:15px;
    background:linear-gradient(180deg,#ff6a4d,#e0432f);box-shadow:0 6px 0 #a8281c,0 10px 18px rgba(224,67,47,.35);cursor:pointer}
  .tapbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a8281c}
  .shop{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .up{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;cursor:pointer;transition:transform .05s}
  .up:active{transform:translateY(1px)}
  .up.dis{opacity:.45;cursor:default}
  .up .ic{font-size:22px}
  .up .t{font-size:11.5px;font-weight:800;margin-top:1px}
  .up .lv{font-size:10px;color:#e7c9a8}
  .up .c{font-size:12px;font-weight:900;color:var(--gold);margin-top:3px}
  .up.buyokdone .c{color:var(--green)}
  .foot{display:flex;gap:8px}
  .foot button{flex:1;background:var(--card);border:1px solid var(--line);color:#e7c9a8;border-radius:12px;padding:8px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .welcome{position:fixed;inset:0;background:rgba(20,8,5,.82);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
  .welcome.show{display:flex}
  .wcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;max-width:300px}
  .wcard h2{margin:0 0 4px;font-size:20px}
  .wcard .big{font-size:26px;font-weight:900;color:var(--gold);margin:8px 0}
  .wcard p{color:#e7c9a8;font-size:13px;margin:5px 0}
  .wcard button{margin-top:12px;background:linear-gradient(180deg,#ff6a4d,#e0432f);border:none;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:11px 26px;border-radius:12px;cursor:pointer}
</style>

<div class="app">
  <div class="hud">
    <div class="money" id="money">$0</div>
    <div class="per" id="per">Toca al cocinero para hacer pizzas 🍕</div>
  </div>

  <div class="scene" id="scene">
    <div class="bunting"></div>
    <div class="sign">🍕 PIZZERÍA<small id="signName">DON TOÑO</small></div>

    <div class="kitchen">
      <div class="chefs" id="chefs">
        <div class="chef">👨‍🍳</div>
        <div class="dough" id="dough">🫓</div>
      </div>
      <div class="cookbadge" id="cookBadge">×1</div>
    </div>
    <div class="tapme" id="tapme">👆 tócame</div>

    <div class="belt"></div>
    <div class="customer" id="customer">😋</div>
  </div>

  <button class="tapbtn" id="tapbtn">🍕 ¡Hacer pizza!</button>

  <div class="shop">
    <div class="up" id="upCook">
      <div class="ic">👨‍🍳</div><div class="t">Cocinero</div>
      <div class="lv" id="cookLv">×1</div><div class="c" id="cookCost">$15</div>
    </div>
    <div class="up" id="upOven">
      <div class="ic">🔥</div><div class="t">Horno</div>
      <div class="lv" id="ovenLv">Niv 1</div><div class="c" id="ovenCost">$50</div>
    </div>
    <div class="up" id="upAuto">
      <div class="ic">🧑‍💼</div><div class="t">Gestor</div>
      <div class="lv" id="autoLv">Manual</div><div class="c" id="autoCost">$100</div>
    </div>
  </div>

  <div class="foot">
    <div class="per" style="flex:1;text-align:center;align-self:center" id="valueInfo">Cada pizza: $1</div>
    <button id="resetBtn">Reiniciar</button>
  </div>
</div>

<div class="welcome" id="welcome">
  <div class="wcard">
    <h2>🍕 ¡Bienvenido de vuelta!</h2>
    <p>Tu pizzería siguió vendiendo:</p>
    <div class="big" id="offAmt">$0</div>
    <p id="offTime"></p>
    <button id="collect">Recoger 🤑</button>
  </div>
</div>

<script>
(() => {
  const $=id=>document.getElementById(id);
  const fmt=n=>{
    if(n<1000) return '$'+((n>=10||Number.isInteger(n))?Math.floor(n):n.toFixed(2));
    const s=['','K','M','B','T','Qa','Qi','Sx','Sp'];let i=Math.floor(Math.log10(n)/3);i=Math.min(i,s.length-1);
    return '$'+(n/Math.pow(1000,i)).toFixed(2)+s[i];
  };
  const now=()=>Date.now();

  // ---- state ----
  const SAVE='pizzeria.v1';
  let money=0, lifetime=0;
  let cooks=1, oven=1, auto=false;
  // economy
  const cookCost=()=>15*Math.pow(1.18,cooks-1);
  const ovenCost=()=>50*Math.pow(1.65,oven-1);
  const AUTO_COST=100;
  const pizzaValue=()=>Math.pow(2,oven-1);              // $ per pizza
  const rate=()=> auto ? cooks*0.85 : 0;                // pizzas/sec automatic

  function save(){ localStorage.setItem(SAVE, JSON.stringify({money,lifetime,cooks,oven,auto,t:now()})); }
  function load(){
    const raw=localStorage.getItem(SAVE); if(!raw) return 0;
    let d; try{d=JSON.parse(raw)}catch(e){return 0}
    money=d.money||0; lifetime=d.lifetime||0; cooks=d.cooks||1; oven=d.oven||1; auto=!!d.auto;
    const el=Math.min((now()-(d.t||now()))/1000, 4*3600);
    let earned=0;
    if(auto && el>1){ earned = rate()*pizzaValue()*el; money+=earned; lifetime+=earned; }
    return earned>0?{earned,el}:0;
  }

  // ---- scene refs ----
  const scene=$('scene'), chefsEl=$('chefs'), customer=$('customer'), dough=$('dough');
  let chefX=60, custX=300, beltY=200;
  function measure(){
    const s=scene.getBoundingClientRect();
    const k=chefsEl.getBoundingClientRect(), c=customer.getBoundingClientRect();
    chefX=k.left - s.left + k.width*0.5;
    custX=c.left - s.left + c.width*0.35;
    beltY=s.height*0.72;
  }
  window.addEventListener('resize',measure);

  // ---- pizza animation ----
  let domPizzas=0; const MAX_DOM=22;
  // spawnPizza only animates for flair; money is credited by the caller. coinVal is the pop amount.
  function spawnPizza(coinVal){
    if(domPizzas<MAX_DOM){
      domPizzas++;
      const p=document.createElement('div'); p.className='pz'; p.textContent='🍕';
      p.style.left=chefX+'px'; p.style.top=beltY+'px';
      scene.appendChild(p);
      const dx=custX-chefX;
      const dur=Math.max(650, 1500 - cooks*20);
      const a=p.animate([
        {transform:'translate(0px,0px) rotate(0deg)'},
        {transform:`translate(${dx*0.5}px,-16px) rotate(180deg)`, offset:.5},
        {transform:`translate(${dx}px,0px) rotate(360deg)`}
      ],{duration:dur, easing:'cubic-bezier(.4,0,.6,1)'});
      a.onfinish=()=>{ p.remove(); domPizzas--; arrive(coinVal); };
    } else {
      arrive(coinVal);
    }
    // chef toss feedback
    chefsEl.classList.add('working');
    dough.animate([
      {transform:'translateX(-50%) translateY(0) scale(.6)', opacity:0},
      {transform:'translateX(-50%) translateY(-18px) scale(1) rotate(180deg)', opacity:1, offset:.5},
      {transform:'translateX(-50%) translateY(0) scale(.6) rotate(360deg)', opacity:0}
    ],{duration:400,easing:'ease-out'});
  }
  function arrive(coinVal){
    // customer chomp
    customer.classList.remove('eat'); void customer.offsetWidth; customer.classList.add('eat');
    // coin pop
    const coin=document.createElement('div'); coin.className='coin'; coin.textContent='+'+fmt(coinVal);
    coin.style.left=(custX-6)+'px'; coin.style.top=(beltY-6)+'px'; scene.appendChild(coin);
    coin.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-40px)',opacity:0}],{duration:850,easing:'ease-out'})
      .onfinish=()=>coin.remove();
  }

  // ---- interactions ----
  function makeManual(){
    const v=pizzaValue(); money+=v; lifetime+=v;   // instant income on tap
    $('money').textContent=fmt(money);
    spawnPizza(v); $('tapme').style.display='none';
  }
  chefsEl.addEventListener('click',makeManual);
  $('tapbtn').addEventListener('click',makeManual);

  $('upCook').addEventListener('click',()=>{ const c=cookCost(); if(money<c)return; money-=c; cooks++; refresh(); save(); });
  $('upOven').addEventListener('click',()=>{ const c=ovenCost(); if(money<c)return; money-=c; oven++; refresh(); save(); });
  $('upAuto').addEventListener('click',()=>{ if(auto)return; if(money<AUTO_COST)return; money-=AUTO_COST; auto=true; refresh(); save(); });
  $('resetBtn').addEventListener('click',()=>{ if(confirm('¿Reiniciar la pizzería?')){ localStorage.removeItem(SAVE); location.reload(); } });

  // ---- UI ----
  function renderChefs(){
    const want=Math.min(cooks,3);
    const cur=chefsEl.querySelectorAll('.chef').length;
    for(let i=cur;i<want;i++){ const e=document.createElement('div'); e.className='chef'; e.textContent='👨‍🍳'; chefsEl.insertBefore(e,dough); }
    for(let i=cur;i>want;i--){ chefsEl.querySelector('.chef:last-of-type')?.remove(); }
    $('cookBadge').textContent='×'+cooks;
  }
  function refresh(){
    $('money').textContent=fmt(money);
    $('cookLv').textContent='×'+cooks;   $('cookCost').textContent=fmt(cookCost());
    $('ovenLv').textContent='Niv '+oven; $('ovenCost').textContent=fmt(ovenCost());
    $('valueInfo').textContent='Cada pizza: '+fmt(pizzaValue());
    $('upCook').classList.toggle('dis',money<cookCost());
    $('upOven').classList.toggle('dis',money<ovenCost());
    if(auto){ $('autoLv').textContent='Automático'; $('autoCost').textContent='✔ Activo'; $('upAuto').classList.add('dis','buyokdone'); }
    else { $('autoLv').textContent='Manual'; $('autoCost').textContent=fmt(AUTO_COST); $('upAuto').classList.toggle('dis',money<AUTO_COST); }
    $('per').textContent = auto ? ('🧑‍💼 '+fmt(rate()*pizzaValue())+'/s automático') : 'Toca al cocinero para hacer pizzas 🍕';
    renderChefs();
  }

  // ---- loop ----
  let last=now(), visualAcc=0, workTimer=0;
  function tick(){
    const t=now(), dt=Math.min((t-last)/1000,.25); last=t;
    if(auto){
      const r=rate();
      money += r*pizzaValue()*dt; lifetime += r*pizzaValue()*dt;   // continuous income
      // spawn visual pizzas (capped) that DON'T re-credit
      visualAcc += Math.min(r, 7)*dt;
      let guard=0;
      const pv=pizzaValue();
      while(visualAcc>=1 && guard++<8){ spawnPizza(pv); visualAcc--; }
      workTimer=t;
    }
    if(t-workTimer>500) chefsEl.classList.remove('working');
    $('money').textContent=fmt(money);
    if((t- (tick._s||0))>500){ refresh(); tick._s=t; }  // lighter UI refresh
    requestAnimationFrame(tick);
  }

  // ---- boot ----
  const NAMES=['DON TOÑO','MAMMA MIA','LA NONNA','BELLA NAPOLI','TU BARRIO'];
  $('signName').textContent = NAMES[(cooks+oven)%NAMES.length];
  const off=load();
  measure(); renderChefs(); refresh();
  requestAnimationFrame(()=>{ measure(); });
  if(off&&off.earned>0){
    $('offAmt').textContent='+'+fmt(off.earned);
    const m=Math.floor(off.el/60);
    $('offTime').textContent = m>60?`en ${Math.floor(m/60)}h ${m%60}m (máx 4h)`:`en ${m} min`;
    $('welcome').classList.add('show');
  }
  $('collect').addEventListener('click',()=>$('welcome').classList.remove('show'));
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
  setInterval(save,5000);
  requestAnimationFrame(tick);
})();
</script>
