<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1410">
<title>Pizzería · idle animada</title>
<style>
  :root{
    --bg:#2a1410; --ink:#fff5e9; --gold:#ffcf4d; --green:#5fe08a; --red:#e04a3a;
    --card:#3a1f16; --line:#5a3423;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(900px 500px at 50% -10%,#3a1c14,#2a1410 60%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:hidden;
    padding:max(6px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));touch-action:manipulation;
  }
  .app{width:100%;max-width:480px;display:flex;flex-direction:column;height:100%;gap:8px}
  .hud{display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:2px}
  .money{font-size:30px;font-weight:900;color:var(--gold);letter-spacing:.5px;text-shadow:0 2px 14px rgba(255,207,77,.3)}
  .per{font-size:12.5px;color:#e7c9a8}
  /* SCENE */
  .scene{position:relative;width:100%;flex:1;min-height:300px;border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,
      #45261a 0%, #45261a 34%,      /* wall */
      #7a4a2b 34%, #8a5730 63%,     /* floor */
      #3b3a44 63%, #33323c 100%);   /* road */
    border:2px solid #1c0d09;box-shadow:inset 0 2px 0 rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.4)}
  .bunting{position:absolute;top:0;left:0;right:0;height:13px;z-index:2;background:repeating-linear-gradient(45deg,#e04a3a 0 12px,#ffd23f 12px 24px);opacity:.85}
  .sign{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:3;background:var(--red);color:#fff;font-weight:900;font-size:13px;letter-spacing:1px;padding:4px 14px;border-radius:10px;box-shadow:0 4px 0 #a8281c,0 8px 14px rgba(0,0,0,.35);border:2px solid #ffd9a0;text-align:center}
  .sign small{display:block;font-size:8.5px;font-weight:700;opacity:.9}
  .roadline{position:absolute;left:0;right:0;top:80.5%;height:3px;z-index:1;background:repeating-linear-gradient(90deg,#ffd23f88 0 16px,transparent 16px 34px)}
  .menu{position:absolute;top:19%;left:6%;z-index:2;background:#241109;border:2px solid #6b4a2e;border-radius:6px;padding:5px 9px;font-size:9.5px;font-weight:700;color:#ffd9a0;line-height:1.55;box-shadow:0 4px 10px rgba(0,0,0,.4)}
  .window{position:absolute;top:16%;right:7%;width:64px;height:46px;z-index:1;border:3px solid #6b4a2e;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,#6fb0dd,#a9dbf2);box-shadow:0 4px 10px rgba(0,0,0,.35)}
  .window span{position:absolute;inset:0;background:
     linear-gradient(#6b4a2e,#6b4a2e) 50% 0/3px 100% no-repeat,
     linear-gradient(#6b4a2e,#6b4a2e) 0 50%/100% 3px no-repeat}
  /* chef */
  .kitchen{position:absolute;left:3%;top:44%;z-index:4;display:flex;flex-direction:column;align-items:center}
  .chefs{display:flex;align-items:flex-end;height:56px;cursor:pointer}
  .chef{font-size:40px;line-height:1;animation:bob 1.6s ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 5px 3px rgba(0,0,0,.35))}
  .chef:nth-child(2){font-size:30px;animation-delay:.3s;margin-left:-7px}
  .chef:nth-child(3){font-size:26px;animation-delay:.6s;margin-left:-7px}
  .chefs.working .chef{animation-duration:.7s}
  .chefs:active{transform:scale(.94)}
  .cookbadge{margin-top:1px;background:#0006;border:1px solid var(--line);border-radius:8px;font-size:10px;font-weight:800;padding:0 7px;color:var(--gold)}
  .dough{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:20px;opacity:0;pointer-events:none}
  /* belt + counter */
  .belt{position:absolute;left:19%;right:36%;top:52%;height:14px;border-radius:7px;z-index:3;background:#2a1a12;border:2px solid #17100b;overflow:hidden}
  .belt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#4b3020 0 13px,#3a251a 13px 26px);animation:belt 1s linear infinite}
  .counter{position:absolute;left:63%;top:48%;width:9%;height:12%;z-index:3;background:linear-gradient(180deg,#c98a4a,#8a5a2e);border:2px solid #5a3a1e;border-radius:4px;box-shadow:0 4px 0 #4a2e18}
  /* moving things */
  .pz{position:absolute;z-index:5;font-size:22px;pointer-events:none;will-change:transform;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
  .cust{position:absolute;z-index:4;font-size:34px;line-height:1;pointer-events:none;will-change:transform,left;filter:drop-shadow(0 5px 3px rgba(0,0,0,.35))}
  .cust .f{display:block}
  .patbar{position:absolute;left:50%;top:-11px;transform:translateX(-50%);width:36px;height:6px;background:#000a;border:1px solid #0007;border-radius:4px;overflow:hidden;opacity:0}
  .patbar i{display:block;height:100%;width:100%;background:#5fe08a;border-radius:4px}
  .combo{position:absolute;top:8px;right:10px;z-index:6;font-weight:900;font-size:13px;color:#ffcf4d;background:#0007;border:1px solid #ffcf4d55;border-radius:9px;padding:3px 8px;opacity:0;transition:opacity .2s;text-shadow:0 1px 2px #000}
  .combo.show{opacity:1;animation:combopop .25s ease}
  @keyframes combopop{from{transform:scale(1.25)}to{transform:scale(1)}}
  .scooter{position:absolute;z-index:5;font-size:30px;line-height:1;pointer-events:none;will-change:transform;filter:drop-shadow(0 4px 2px rgba(0,0,0,.35))}
  .scooter .box{position:absolute;top:-8px;left:2px;font-size:13px}
  .house{position:absolute;right:2%;top:66%;font-size:38px;z-index:3;filter:drop-shadow(0 5px 3px rgba(0,0,0,.35))}
  .coin{position:absolute;z-index:6;font-weight:900;font-size:14px;color:var(--green);pointer-events:none;text-shadow:0 1px 2px #000}
  .tapme{position:absolute;left:4%;top:38%;z-index:5;font-size:11px;color:#ffe;opacity:.9;animation:pulse 1.3s ease-in-out infinite;pointer-events:none}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
  @keyframes belt{to{background-position:-26px 0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  /* controls */
  .tapbtn{width:100%;font:inherit;font-weight:900;font-size:17px;color:#fff;border:none;border-radius:15px;padding:14px;background:linear-gradient(180deg,#ff6a4d,#e0432f);box-shadow:0 6px 0 #a8281c,0 10px 18px rgba(224,67,47,.35);cursor:pointer}
  .tapbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a8281c}
  .shop{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
  .up{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 3px;text-align:center;cursor:pointer;transition:transform .05s}
  .up:active{transform:translateY(1px)}
  .up.dis{opacity:.45;cursor:default}
  .up .ic{font-size:20px}
  .up .t{font-size:11px;font-weight:800;margin-top:1px}
  .up .lv{font-size:9.5px;color:#e7c9a8}
  .up .c{font-size:11.5px;font-weight:900;color:var(--gold);margin-top:2px}
  .up.buyokdone .c{color:var(--green)}
  .foot{display:flex;gap:8px}
  .foot .info{flex:1;text-align:center;align-self:center;font-size:12px;color:#e7c9a8}
  .foot button{background:var(--card);border:1px solid var(--line);color:#e7c9a8;border-radius:12px;padding:8px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .welcome{position:fixed;inset:0;background:rgba(20,8,5,.82);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:30;padding:24px}
  .welcome.show{display:flex}
  .wcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;max-width:300px}
  .wcard h2{margin:0 0 4px;font-size:20px}
  .wcard .big{font-size:26px;font-weight:900;color:var(--gold);margin:8px 0}
  .wcard p{color:#e7c9a8;font-size:13px;margin:5px 0}
  .wcard button{margin-top:12px;background:linear-gradient(180deg,#ff6a4d,#e0432f);border:none;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:11px 26px;border-radius:12px;cursor:pointer}
</style>

<div class="app">
  <div class="hud">
    <div class="money" id="money">$0</div>
    <div class="per" id="per">Toca al cocinero para hacer pizzas 🍕</div>
  </div>

  <div class="scene" id="scene">
    <div class="bunting"></div>
    <div class="sign">🍕 PIZZERÍA<small id="signName">DON TOÑO</small></div>
    <div class="combo" id="combo"></div>
    <div class="menu">MENÚ<br>🍕 Margarita<br>🍕 Pepperoni<br>🍕 Especial</div>
    <div class="window"><span></span></div>
    <div class="roadline"></div>

    <div class="kitchen">
      <div class="chefs" id="chefs">
        <div class="chef">👨‍🍳</div>
        <div class="dough" id="dough">🫓</div>
      </div>
      <div class="cookbadge" id="cookBadge">×1</div>
    </div>
    <div class="tapme" id="tapme">👆 tócame</div>

    <div class="belt"></div>
    <div class="counter"></div>
    <div class="house">🏠</div>
  </div>

  <button class="tapbtn" id="tapbtn">🍕 ¡Hacer pizza!</button>

  <div class="shop">
    <div class="up" id="upCook"><div class="ic">👨‍🍳</div><div class="t">Cocinero</div><div class="lv" id="cookLv">×1</div><div class="c" id="cookCost">$15</div></div>
    <div class="up" id="upOven"><div class="ic">🔥</div><div class="t">Horno</div><div class="lv" id="ovenLv">Niv 1</div><div class="c" id="ovenCost">$50</div></div>
    <div class="up" id="upAuto"><div class="ic">🧑‍💼</div><div class="t">Gestor</div><div class="lv" id="autoLv">Manual</div><div class="c" id="autoCost">$100</div></div>
    <div class="up" id="upDeli"><div class="ic">🛵</div><div class="t">Reparto</div><div class="lv" id="deliLv">×0</div><div class="c" id="deliCost">$150</div></div>
  </div>

  <div class="foot">
    <div class="info" id="valueInfo">Cada pizza: $1</div>
    <button id="resetBtn">Reiniciar</button>
  </div>
</div>

<div class="welcome" id="welcome">
  <div class="wcard">
    <h2>🍕 ¡Bienvenido de vuelta!</h2>
    <p>Tu pizzería siguió vendiendo y repartiendo:</p>
    <div class="big" id="offAmt">$0</div>
    <p id="offTime"></p>
    <button id="collect">Recoger 🤑</button>
  </div>
</div>

<script>
(() => {
  const $=id=>document.getElementById(id);
  const fmt=n=>{
    if(n<1000) return '$'+((n>=10||Number.isInteger(n))?Math.floor(n):n.toFixed(2));
    const s=['','K','M','B','T','Qa','Qi','Sx','Sp'];let i=Math.floor(Math.log10(n)/3);i=Math.min(i,s.length-1);
    return '$'+(n/Math.pow(1000,i)).toFixed(2)+s[i];
  };
  const now=()=>Date.now();
  const num=t=>parseFloat(String(t).replace(/[^0-9.]/g,''))||0;

  // ---- state / economy ----
  const SAVE='pizzeria.v2';
  let money=0, lifetime=0;
  let cooks=1, oven=1, auto=false, scooters=0;
  const cookCost=()=>15*Math.pow(1.18,cooks-1);
  const ovenCost=()=>50*Math.pow(1.65,oven-1);
  const AUTO_COST=100;
  const deliCost=()=>150*Math.pow(1.5,scooters);
  const pizzaValue=()=>Math.pow(2,oven-1);
  const DELIVERY_MULT=3;
  const counterRate=()=> auto ? cooks*0.85 : 0;          // pizzas/sec at counter
  const deliveryRate=()=> scooters*0.5;                  // deliveries/sec
  const autoIncomePerSec=()=> counterRate()*pizzaValue() + deliveryRate()*pizzaValue()*DELIVERY_MULT;

  function save(){ localStorage.setItem(SAVE, JSON.stringify({money,lifetime,cooks,oven,auto,scooters,t:now()})); }
  function load(){
    const raw=localStorage.getItem(SAVE); if(!raw) return 0;
    let d; try{d=JSON.parse(raw)}catch(e){return 0}
    money=d.money||0; lifetime=d.lifetime||0; cooks=d.cooks||1; oven=d.oven||1; auto=!!d.auto; scooters=d.scooters||0;
    const el=Math.min((now()-(d.t||now()))/1000, 4*3600);
    let earned=0;
    if(el>1){ earned = autoIncomePerSec()*el; money+=earned; lifetime+=earned; }
    return earned>0?{earned,el}:0;
  }

  // ---- geometry ----
  const scene=$('scene'), chefsEl=$('chefs'), dough=$('dough'), house=$('house');
  let W=390,H=300, chefX=50, beltY=150, counterX=250, custY=180, roadY=250, pickX=55, houseX=350;
  function measure(){
    const r=scene.getBoundingClientRect(); W=r.width; H=r.height;
    chefX=W*0.13; beltY=H*0.52; counterX=W*0.655; custY=H*0.56;
    roadY=H*0.80; pickX=W*0.14; houseX=W*0.86;
  }
  window.addEventListener('resize',()=>{ measure(); });

  // ---- pizzas (counter) ----
  let domPizzas=0; const MAX_DOM=20;
  function spawnPizza(coinVal){
    if(domPizzas<MAX_DOM){
      domPizzas++;
      const p=document.createElement('div'); p.className='pz'; p.textContent='🍕';
      p.style.left=chefX+'px'; p.style.top=beltY+'px'; scene.appendChild(p);
      const dx=counterX-chefX, dur=Math.max(650,1500-cooks*20);
      const a=p.animate([
        {transform:'translate(0,0) rotate(0)'},
        {transform:`translate(${dx*0.5}px,-16px) rotate(180deg)`,offset:.5},
        {transform:`translate(${dx}px,0) rotate(360deg)`}
      ],{duration:dur,easing:'cubic-bezier(.4,0,.6,1)'});
      a.onfinish=()=>{ p.remove(); domPizzas--; serveCounter(coinVal); };
    } else serveCounter(coinVal);
    chefsEl.classList.add('working');
    dough.animate([
      {transform:'translateX(-50%) translateY(0) scale(.6)',opacity:0},
      {transform:'translateX(-50%) translateY(-16px) scale(1) rotate(180deg)',opacity:1,offset:.5},
      {transform:'translateX(-50%) translateY(0) scale(.6) rotate(360deg)',opacity:0}
    ],{duration:400,easing:'ease-out'});
  }
  function coinPop(x,y,val){
    const c=document.createElement('div'); c.className='coin'; c.textContent='+'+fmt(val);
    c.style.left=(x-6)+'px'; c.style.top=(y-6)+'px'; scene.appendChild(c);
    c.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-38px)',opacity:0}],{duration:850,easing:'ease-out'}).onfinish=()=>c.remove();
  }
  function serveCounter(val){
    if(queue.length && queue[0].active) serveFront();          // serve the waiting customer (tip+combo)
    else coinPop(counterX+W*0.02, beltY, val);                 // walk-in sale, nobody waiting
  }

  // ---- customers: arrive, wait (patience!), served in time = tip+combo, too slow = angry ----
  const FACES=['🧑','👩','👨','🧓','👦','🧔','👩‍🦰','🧑‍🦱','👱','🧕'];
  let queue=[]; const MAXQ=4; let faceIdx=0;
  let combo=1;
  const PATIENCE=6;                                  // seconds the front customer will wait
  function slotX(i){ return counterX + W*0.085 + i*(W*0.072); }
  function makeCust(){
    const el=document.createElement('div'); el.className='cust';
    const face=FACES[(faceIdx++)%FACES.length];
    el.innerHTML=`<span class="f">${face}</span><span class="patbar"><i></i></span>`;
    el.style.top=custY+'px'; el.style.left=(W*1.05)+'px';
    return {el, faceEl:el.querySelector('.f'), bar:el.querySelector('.patbar'), fill:el.querySelector('.patbar i'), active:false, patience:PATIENCE, done:false};
  }
  function layoutQueue(newest){
    queue.forEach((c,i)=>{
      const to=slotX(i);
      if(c===newest) c.el.animate([{left:(W*1.05)+'px'},{left:to+'px'}],{duration:850,easing:'ease-out',fill:'forwards'});
      else c.el.animate([{left:c.el.style.left||to+'px'},{left:to+'px'}],{duration:400,easing:'ease-out',fill:'forwards'});
      c.el.style.left=to+'px';
    });
  }
  function spawnCustomer(){
    if(queue.length>=MAXQ) return;
    const c=makeCust(); scene.appendChild(c.el); queue.push(c); layoutQueue(c);
  }
  function leaveCust(c,happy){
    c.done=true; c.bar.style.opacity='0'; c.faceEl.textContent = happy?'😋':'😠';
    const anim = happy
      ? [{transform:'translateY(0) scale(1)',opacity:1},{transform:'translateY(-12px) scale(1.15)',opacity:1,offset:.4},{transform:'translateY(-48px) scale(.8)',opacity:0}]
      : [{transform:'translateX(0) rotate(0)',opacity:1},{transform:'translateX(-5px) rotate(-9deg)',offset:.2},{transform:'translateX(5px) rotate(9deg)',offset:.45},{transform:'translateX(0) rotate(0)',offset:.65},{transform:'translateY(-26px)',opacity:0}];
    c.el.animate(anim,{duration:happy?650:850,easing:'ease-in'}).onfinish=()=>c.el.remove();
  }
  function serveFront(){                              // a pizza reached a waiting customer
    const c=queue.shift(); if(!c) return false;
    const tip=Math.ceil(pizzaValue()*0.5*combo);       // tip on top of the base sale, scales with combo
    money+=tip; lifetime+=tip;
    coinPop(slotX(0), custY-6, tip);
    combo=Math.min(combo+1,99); updateCombo();
    leaveCust(c,true); layoutQueue(); return true;
  }
  function angryFront(){                              // patience ran out
    const c=queue.shift(); if(!c) return;
    combo=1; updateCombo();
    const f=document.createElement('div'); f.className='coin'; f.style.color='#ff6b6b'; f.textContent='😠 −propina';
    f.style.left=(slotX(0)-14)+'px'; f.style.top=(custY-6)+'px'; scene.appendChild(f);
    f.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-30px)',opacity:0}],{duration:850}).onfinish=()=>f.remove();
    leaveCust(c,false); layoutQueue();
  }
  function updateCombo(){ const e=$('combo'); if(combo>1){ e.textContent='🔥 x'+combo+' propina'; e.classList.add('show'); } else e.classList.remove('show'); }

  // ---- delivery scooters ----
  let scEls=[]; const MAX_SC_DOM=5;
  function syncScooters(){
    const want=Math.min(scooters,MAX_SC_DOM);
    for(let i=scEls.length;i<want;i++) addScooter(i);
    // (we don't remove on purpose; scooters only ever increase)
  }
  function placeScooter(el,x,flip){ el.style.transform=`translateX(${x}px)`+(flip?' scaleX(-1)':''); }
  function addScooter(i){
    const el=document.createElement('div'); el.className='scooter'; el.innerHTML='🛵<span class="box">🍕</span>';
    el.style.top=(roadY-6)+'px'; el.style.left='0px'; placeScooter(el,pickX,false);
    scene.appendChild(el); scEls.push(el);
    setTimeout(()=>runScooter(el,true), i*450);   // stagger starts
  }
  function runScooter(el,goingOut){
    const box=el.querySelector('.box');
    const fromX = goingOut? pickX : houseX;
    const toX   = goingOut? houseX : pickX;
    const flip = toX<fromX;                 // heading left → mirror the scooter
    const f = flip? ' scaleX(-1)':'';
    box.style.opacity = goingOut? '1':'0';
    const dur = goingOut? 2600 : 2100;
    const a=el.animate([
      {transform:`translateX(${fromX}px)${f}`},
      {transform:`translateX(${toX}px)${f}`}
    ],{duration:dur,easing:'linear'});
    a.onfinish=()=>{
      placeScooter(el,toX,flip);             // persist final position
      if(goingOut){ coinPop(houseX, roadY-14, pizzaValue()*DELIVERY_MULT); box.style.opacity='0'; runScooter(el,false); }
      else runScooter(el,true);
    };
  }

  // ---- interactions ----
  function makeManual(){ const v=pizzaValue(); money+=v; lifetime+=v; $('money').textContent=fmt(money); spawnPizza(v); $('tapme').style.display='none'; }
  chefsEl.addEventListener('click',makeManual);
  $('tapbtn').addEventListener('click',makeManual);
  $('upCook').addEventListener('click',()=>{ const c=cookCost(); if(money<c)return; money-=c; cooks++; refresh(); save(); });
  $('upOven').addEventListener('click',()=>{ const c=ovenCost(); if(money<c)return; money-=c; oven++; refresh(); save(); });
  $('upAuto').addEventListener('click',()=>{ if(auto)return; if(money<AUTO_COST)return; money-=AUTO_COST; auto=true; refresh(); save(); });
  $('upDeli').addEventListener('click',()=>{ const c=deliCost(); if(money<c)return; money-=c; scooters++; syncScooters(); refresh(); save(); });
  $('resetBtn').addEventListener('click',()=>{ if(confirm('¿Reiniciar la pizzería?')){ localStorage.removeItem(SAVE); location.reload(); } });

  // ---- UI ----
  function renderChefs(){
    const want=Math.min(cooks,3), cur=chefsEl.querySelectorAll('.chef').length;
    for(let i=cur;i<want;i++){ const e=document.createElement('div'); e.className='chef'; e.textContent='👨‍🍳'; chefsEl.insertBefore(e,dough); }
    for(let i=cur;i>want;i--) chefsEl.querySelector('.chef:last-of-type')?.remove();
    $('cookBadge').textContent='×'+cooks;
  }
  function refresh(){
    $('money').textContent=fmt(money);
    $('cookLv').textContent='×'+cooks; $('cookCost').textContent=fmt(cookCost());
    $('ovenLv').textContent='Niv '+oven; $('ovenCost').textContent=fmt(ovenCost());
    $('deliLv').textContent='×'+scooters; $('deliCost').textContent=fmt(deliCost());
    $('valueInfo').textContent='Cada pizza: '+fmt(pizzaValue());
    $('upCook').classList.toggle('dis',money<cookCost());
    $('upOven').classList.toggle('dis',money<ovenCost());
    $('upDeli').classList.toggle('dis',money<deliCost());
    if(auto){ $('autoLv').textContent='Auto'; $('autoCost').textContent='✔'; $('upAuto').classList.add('dis','buyokdone'); }
    else { $('autoLv').textContent='Manual'; $('autoCost').textContent=fmt(AUTO_COST); $('upAuto').classList.toggle('dis',money<AUTO_COST); }
    const inc=autoIncomePerSec();
    $('per').textContent = inc>0 ? ('💰 '+fmt(inc)+'/s automático') : 'Toca al cocinero para hacer pizzas 🍕';
    renderChefs();
  }

  // ---- loop ----
  let last=now(), visualAcc=0, workTimer=0, spawnTimer=0;
  function tick(){
    const t=now(), dt=Math.min((t-last)/1000,.25); last=t;
    const inc=autoIncomePerSec();
    if(inc>0){ money+=inc*dt; lifetime+=inc*dt; }
    // visual counter pizzas from the gestor (each arrival serves the waiting customer)
    const cr=counterRate();
    if(cr>0){ visualAcc+=Math.min(cr,6)*dt; let g=0; const pv=pizzaValue(); while(visualAcc>=1&&g++<6){ spawnPizza(pv); visualAcc--; } workTimer=t; }
    if(t-workTimer>500) chefsEl.classList.remove('working');
    // customers keep arriving
    if(t-spawnTimer>1000){ spawnCustomer(); spawnTimer=t; }
    // front customer's patience drains — serve in time or they get angry
    const front=queue[0];
    if(front){
      if(!front.active){ front.active=true; front.patience=PATIENCE; front.bar.style.opacity='1'; }
      front.patience-=dt;
      const p=Math.max(0,front.patience/PATIENCE);
      front.fill.style.width=(p*100)+'%';
      front.fill.style.background = p>0.5?'#5fe08a':(p>0.22?'#ffd23f':'#ff6b6b');
      if(front.patience<=0) angryFront();
    }
    $('money').textContent=fmt(money);
    if(t-(tick._s||0)>500){ refresh(); tick._s=t; }
    requestAnimationFrame(tick);
  }

  // ---- boot ----
  const NAMES=['DON TOÑO','MAMMA MIA','LA NONNA','BELLA NAPOLI','TU BARRIO'];
  const off=load();
  $('signName').textContent=NAMES[(cooks+oven)%NAMES.length];
  measure(); renderChefs(); refresh(); syncScooters();
  spawnCustomer(); spawnCustomer();
  requestAnimationFrame(()=>{ measure(); });
  if(off&&off.earned>0){
    $('offAmt').textContent='+'+fmt(off.earned);
    const m=Math.floor(off.el/60);
    $('offTime').textContent = m>60?`en ${Math.floor(m/60)}h ${m%60}m (máx 4h)`:`en ${m} min`;
    $('welcome').classList.add('show');
  }
  $('collect').addEventListener('click',()=>$('welcome').classList.remove('show'));
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
  setInterval(save,5000);
  requestAnimationFrame(tick);
})();
</script>
